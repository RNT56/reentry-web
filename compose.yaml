services:
  reentry:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env to your HTTPS origin}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      TRUST_PROXY: "1"
      AI_MASTER_KEY: ${AI_MASTER_KEY:-}
      ENABLE_BACKGROUND_JOBS: ${ENABLE_BACKGROUND_JOBS:-false}
      AUTHOR_USERNAMES: ${AUTHOR_USERNAMES:-}
      AUTHOR_PUBLIC_NAME: ${AUTHOR_PUBLIC_NAME:-RNT}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
    ports:
      - "127.0.0.1:${APP_PORT:-4173}:4173"
    volumes:
      - reentry-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 2
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  reentry-data:
